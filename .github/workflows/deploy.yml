name: Deploy to Timeweb

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Deploy via SSH (attempt 1)
        id: deploy_attempt_1
        continue-on-error: true
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # --delete mirrors dist/ onto the host, but /razbor/ is managed
          # manually on the server and must never be touched
          switches: -avzr --delete --exclude 'razbor/'
          path: dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Wait before deploy retry
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 30
      - name: Retry Deploy via SSH (attempt 2)
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude 'razbor/'
          path: dist/
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
